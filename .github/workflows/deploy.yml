name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TENDER_AI_QUEUE_NAME: ${{ vars.TENDER_AI_QUEUE_NAME }}
      TENDER_AI_DLQ_NAME: ${{ vars.TENDER_AI_DLQ_NAME }}
      TENDER_AI_CRON: ${{ vars.TENDER_AI_CRON }}
      TENDER_SOURCE_CRON: ${{ vars.TENDER_SOURCE_CRON }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      DEEPSEEK_STRATEGY_MODEL: ${{ vars.DEEPSEEK_STRATEGY_MODEL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build and test
        run: npm test

      - name: Deploy with Wrangler
        shell: bash
        run: |
          set -o pipefail
          npm run deploy | tee wrangler-deploy.log

          version_id="$(grep -E 'Current Version ID:' wrangler-deploy.log | tail -n 1 | sed -E 's/.*Current Version ID:[[:space:]]*//' || true)"
          if [[ -z "$version_id" ]]; then
            version_id="not reported by Wrangler"
          fi

          {
            echo "## Cloudflare production deployment"
            echo "- Git commit: \`$GITHUB_SHA\`"
            echo "- Cloudflare version: \`$version_id\`"
            echo "- Worker: \`sts-tender-intelligence\`"
          } >> "$GITHUB_STEP_SUMMARY"
