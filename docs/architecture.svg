<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">STS tender intelligence reference architecture</title>
  <desc id="desc">A layered flow from Australian procurement sources through collection, document processing, data quality, structured storage, AI intelligence and analysis.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      .heading { font: 700 27px system-ui, sans-serif; fill: #0f172a; }
      .label { font: 700 18px system-ui, sans-serif; fill: #0f172a; }
      .copy { font: 15px system-ui, sans-serif; fill: #334155; }
      .small { font: 13px system-ui, sans-serif; fill: #475569; }
      .box { stroke: #94a3b8; stroke-width: 1.5; rx: 14; }
      .flow { stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="60" y="52" class="heading">STS tender intelligence — provenance-first architecture</text>

  <rect x="60" y="85" width="1080" height="88" class="box" fill="#e0f2fe"/>
  <text x="84" y="116" class="label">Australian sources</text>
  <text x="84" y="145" class="copy">AusTender · buy NSW · state portals · planning approvals · user-authorised exports</text>
  <text x="810" y="116" class="small">Official sources remain authoritative</text>
  <text x="810" y="140" class="small">Raw responses + retrieval metadata retained</text>

  <line x1="600" y1="173" x2="600" y2="205" class="flow"/>
  <rect x="60" y="207" width="520" height="108" class="box" fill="#dcfce7"/>
  <text x="84" y="238" class="label">Collection</text>
  <text x="84" y="267" class="copy">Scrapy / Crawlee · checkpoints · retries · source monitoring</text>
  <text x="84" y="292" class="small">opencontractau: audited adapter reference, not an authority</text>
  <rect x="620" y="207" width="520" height="108" class="box" fill="#fef3c7"/>
  <text x="644" y="238" class="label">Document processing</text>
  <text x="644" y="267" class="copy">Docling · PDF / DOCX / tables · page-level evidence</text>
  <text x="644" y="292" class="small">Original document and extraction version preserved</text>

  <line x1="320" y1="315" x2="480" y2="355" class="flow"/>
  <line x1="880" y1="315" x2="720" y2="355" class="flow"/>
  <rect x="250" y="357" width="700" height="108" class="box" fill="#ede9fe"/>
  <text x="274" y="388" class="label">Quality and normalization</text>
  <text x="274" y="417" class="copy">kingfisher-process · ocdskit · Splink · deterministic validation</text>
  <text x="274" y="442" class="small">Common schema: buyer · supplier · value · dates · category · contract · provenance</text>

  <line x1="600" y1="465" x2="600" y2="497" class="flow"/>
  <rect x="60" y="499" width="1080" height="104" class="box" fill="#ffe4e6"/>
  <text x="84" y="530" class="label">System of record (≈70%)</text>
  <text x="84" y="559" class="copy">Supabase PostgreSQL · relational tender, award, party, project and outcome tables</text>
  <text x="84" y="584" class="small">pgvector supplements structured retrieval · deterministic SQL owns values, dates, margins and filters</text>

  <line x1="390" y1="603" x2="390" y2="635" class="flow"/>
  <line x1="810" y1="603" x2="810" y2="635" class="flow"/>
  <rect x="60" y="637" width="650" height="88" class="box" fill="#cffafe"/>
  <text x="84" y="668" class="label">Intelligence (≈20% documents + ≈10% workflow)</text>
  <text x="84" y="697" class="copy">PydanticAI · FastEmbed · controlled extraction, relevance and bid/no-bid</text>
  <rect x="750" y="637" width="390" height="88" class="box" fill="#dbeafe"/>
  <text x="774" y="668" class="label">Analysis</text>
  <text x="774" y="697" class="copy">DuckDB / Polars · notebooks-ocds · BI</text>
</svg>
