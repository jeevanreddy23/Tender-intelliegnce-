<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Bounded tender analysis fan-out and fan-in graph</title>
  <desc id="desc">Deterministic collection and shortlisting precede parallel validated analysis nodes. A synthesis node combines successful results before deterministic approval and Power Apps workflow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker>
    <style>.h{font:700 26px system-ui;fill:#0f172a}.t{font:700 16px system-ui;fill:#0f172a}.s{font:13px system-ui;fill:#475569}.b{stroke:#94a3b8;stroke-width:1.5;rx:12}.a{stroke:#64748b;stroke-width:2;marker-end:url(#arrow);fill:none}.d{stroke-dasharray:5 4}</style>
  </defs>
  <rect width="1200" height="650" fill="#f8fafc"/><text x="50" y="44" class="h">Shortlist first; use bounded AI analysis only where it adds value</text>
  <rect x="50" y="78" width="190" height="92" class="b" fill="#e0f2fe"/><text x="72" y="112" class="t">Collect + normalize</text><text x="72" y="137" class="s">Scrapers, documents, DB</text><text x="72" y="157" class="s">Provenance retained</text>
  <path d="M240 124H280" class="a"/><rect x="282" y="78" width="220" height="92" class="b" fill="#dcfce7"/><text x="304" y="108" class="t">Deterministic shortlist</text><text x="304" y="133" class="s">Duplicate, close date, criteria</text><text x="304" y="153" class="s">margin, resources, relevance</text>
  <path d="M502 124H555V230" class="a"/><path d="M502 124H555V330" class="a"/><path d="M502 124H555V430" class="a"/><path d="M502 124H555V530" class="a"/>
  <rect x="558" y="187" width="250" height="78" class="b" fill="#ede9fe"/><text x="580" y="217" class="t">Scope node</text><text x="580" y="242" class="s">Services, quantities, page evidence</text>
  <rect x="558" y="287" width="250" height="78" class="b" fill="#ede9fe"/><text x="580" y="317" class="t">Eligibility node</text><text x="580" y="342" class="s">Accreditation, briefing, experience</text>
  <rect x="558" y="387" width="250" height="78" class="b" fill="#ede9fe"/><text x="580" y="417" class="t">History node</text><text x="580" y="442" class="s">Awards, competitors, comparables</text>
  <rect x="558" y="487" width="250" height="78" class="b" fill="#ede9fe"/><text x="580" y="517" class="t">Logistics node</text><text x="580" y="542" class="s">Location and mobilisation evidence</text>
  <path d="M808 226H850V350" class="a"/><path d="M808 326H850V350" class="a"/><path d="M808 426H850V350" class="a"/><path d="M808 526H850V350" class="a"/>
  <rect x="852" y="290" width="290" height="120" class="b" fill="#fef3c7"/><text x="874" y="320" class="t">Evidence-backed synthesis</text><text x="874" y="345" class="s">Expected vs completed nodes</text><text x="874" y="365" class="s">Recommendation, gaps, confidence</text><text x="874" y="385" class="s">Failed-node + cost audit history</text>
  <path d="M997 410V458" class="a"/><rect x="852" y="460" width="290" height="105" class="b" fill="#ffe4e6"/><text x="874" y="490" class="t">Rules + human approval</text><text x="874" y="515" class="s">AI cannot override hard gates</text><text x="874" y="535" class="s">High-value tenders require review</text><text x="874" y="555" class="s">Then send to Power Apps</text>
  <rect x="50" y="585" width="758" height="44" class="b d" fill="#fff"/><text x="72" y="612" class="s">All nodes: validated Pydantic output · semaphore · timeout · retry · cost cap · explicit failure status</text>
</svg>
